name: Coinbase API Pipeline Tests

on:
  push:
    paths:
      - 'coinbase-api-pipeline/**'
      - '.github/workflows/coinbase-api-pipeline-tests.yml'
  pull_request:
    paths:
      - 'coinbase-api-pipeline/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: coinbase-api-pipeline
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: coinbase-api-pipeline
        run: pytest -q
